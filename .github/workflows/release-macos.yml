name: Release macOS

# =============================================================================
# MJNexus-Reader macOS 发布工作流
# =============================================================================
#
# 触发条件：
#   - push 形如 v1.0.0 / v1.0.0-rc.1 的 tag
#   - 手动 workflow_dispatch（可选 features，如 `llamacpp,llama-metal`）
#
# 流程：checkout → setup node/rust → npm ci → tauri build（--bundles app）
#       → 可选签名（Tauri 2 内建，走 APPLE_* 环境变量）→ hdiutil 打 DMG
#       → 上传 .app / .dmg artifact 并挂到 GitHub Release
#
# 必需 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   APPLE_CERTIFICATE            base64 编码的 .p12 证书内容
#   APPLE_CERTIFICATE_PASSWORD   导出 .p12 时的密码
#   APPLE_SIGNING_IDENTITY       Developer ID Application 证书 CN
#   APPLE_ID                     Apple Developer 账号邮箱
#   APPLE_PASSWORD               App-specific password
#   APPLE_TEAM_ID                10 位 Team ID
#
# 未配置 Secrets 时工作流仍会运行，但跳过签名（产物未签名，仅内部测试用）。
#
# 历史坑位（2026-09-05 修正，勿回退）：
#   - 旧版用 pnpm + `mjnexus-reader/` 路径前缀 + `scripts/sign-macos.sh` +
#     `scripts/patch-canvas.cjs`；后两者在本仓库根本不存在，工作流第 3 步即失败
#     （`Some specified paths were not resolved, unable to cache dependencies`）。
#   - 本仓库已全面迁移 npm（frontend/package-lock.json），且 src-tauri/ 与 frontend/
#     为同级目录，不存在 `mjnexus-reader/` 这一层。
#   - 签名改用 Tauri 2 内建能力（APPLE_* 环境变量），不再手写 keychain 导入脚本。
# =============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      features:
        description: '额外 cargo features（如 llamacpp,llama-metal）；留空用 Cargo.toml default'
        required: false
        default: ''

permissions:
  contents: write # 上传 release asset 需要

jobs:
  release-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14 # Apple Silicon runner

    env:
      # whisper-rs-sys 的 C++（whisper.cpp / ggml-backend-reg.cpp）用了 std::filesystem，
      # 该 API 自 macOS 10.15 起可用。其 build.rs 用 cmake crate 编译，cmake 子进程会把
      # 部署目标写进 CMakeCache（CMAKE_OSX_DEPLOYMENT_TARGET），默认落到 10.13，
      # 导致一堆 `'path' is unavailable: introduced in macOS 10.15` 编译错误。
      #
      # 正解（2026-09-05 修正，勿回退）：直接设 CMAKE_OSX_DEPLOYMENT_TARGET=11.0。
      # cmake 初始化 CMAKE_OSX_DEPLOYMENT_TARGET 缓存变量时会读取同名环境变量；
      # 仅设 MACOSX_DEPLOYMENT_TARGET（cc crate 读的那个）不足以驱动 cmake 子进程，
      # 之前两次构建均因此失败。下方 rust-cache 的 key 换值强制丢弃陈旧 cmake 缓存，
      # 让 whisper.cpp 以 11.0 重新配置编译。
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CMAKE_OSX_DEPLOYMENT_TARGET: '11.0'
      # Tauri 2 内建签名 / 公证；Secrets 缺失时为空串，构建自动降级为未签名。
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # key 换值 → 强制丢弃旧缓存（含陈旧的 whisper-rs-sys C++ 产物），
          # 让 whisper.cpp 用 MACOSX_DEPLOYMENT_TARGET/CXXFLAGS=11.0 重新编译。
          key: macos-whisper-min11
          workspaces: src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build with Tauri
        # 从仓库根目录调用 frontend 里的 CLI：CLI 需在同级看到 src-tauri/ 与 frontend/。
        # beforeBuildCommand（tauri.conf.json）会自行执行 npx vite build，此处不重复。
        run: |
          set -euo pipefail
          FEATURES="${{ github.event.inputs.features || '' }}"
          ARGS=(build --bundles app)
          if [ -n "$FEATURES" ]; then
            ARGS+=(--features "$FEATURES")
          fi
          ./frontend/node_modules/.bin/tauri "${ARGS[@]}"

      - name: Warn if unsigned
        if: ${{ env.APPLE_SIGNING_IDENTITY == '' }}
        run: echo "::warning::未配置 APPLE_* Secrets，产物未签名，仅可用于内部测试。"

      - name: Create DMG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/release/bundle/macos/MJNexus-Reader.app"
          test -d "$APP_PATH" || { echo "::error::未找到 .app：$APP_PATH"; exit 1; }
          DMG_STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$DMG_STAGE"
          cp -R "$APP_PATH" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          DMG_PATH="MJNexus-Reader-${TAG}-macos.dmg"
          hdiutil create -volname "MJNexus-Reader" \
            -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Sign DMG (optional)
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          set -euo pipefail
          codesign --sign "${APPLE_SIGNING_IDENTITY}" --timestamp --options runtime "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJNexus-Reader-${{ github.ref_name }}-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJNexus-Reader-${{ github.ref_name }}-macos-dmg
          path: '*.dmg'
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.dmg
          draft: true
          generate_release_notes: true
