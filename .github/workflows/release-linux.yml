name: Release Linux

# =============================================================================
# MJNexus-Reader Linux 发布工作流
# =============================================================================
#
# 触发条件：
#   - push 形如 v1.0.0 / v1.0.0-rc.1 的 tag
#   - 手动 workflow_dispatch（可选 features，如 `llamacpp`）
#
# 流程：checkout → apt 装系统依赖（webkit2gtk-4.1 等）→ setup node/rust
#       → npm ci → tauri build（--bundles deb appimage）
#       → 重命名为统一命名 → 上传 .deb / .AppImage 并挂到 GitHub Release
#
# 说明：桌面端 AI 后端走云端 API / 本地 Ollama（Cargo.toml default 不含 llamacpp），
#       故桌面构建无需端侧推理相关 feature。需要本地模型时再 `cargo tauri build --features llamacpp`。
#
# 历史坑位（2026-09-05）：
#   - Tauri 2 在 Linux 依赖 webkit2gtk-4.1（≥2.40）。ubuntu-24.04 默认源提供
#     libwebkit2gtk-4.1-dev，必须显式 apt 安装，否则 `tauri build` 在链接阶段报找不到
#     webkit 符号。appimage 还需 patchelf。
#   - 🔑 链接坑（首跑失败根因）：rust-lld 报 undefined symbol
#     `__isoc23_strtol/strtoll/strtoull`（glibc ≥2.38 才有）+ `std::__cxx11::basic_string::_M_replace_cold`
#     （libstdc++）。前者来自本项目 `ort` 的 onnxruntime 预编译库（download-binaries 下载的
#     Linux 版按 glibc ≥2.38 构建），ubuntu-22.04 的 glibc 2.35 没有 `__isoc23_*` → 链接失败；
#     后者是 rust-lld 默认不自动链接 libstdc++。
#     修复：runner 改用 ubuntu-24.04（glibc 2.39，含 `__isoc23_*`）+ 构建步加
#     `RUSTFLAGS="-C link-arg=-lstdc++"` 显式链接 libstdc++。
#   - 调用方式与 release-macos.yml 保持一致：从仓库根目录执行
#     `./frontend/node_modules/.bin/tauri`（CLI 需在同级看到 src-tauri/ 与 frontend/）。
# =============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      features:
        description: '额外 cargo features（如 llamacpp）；留空用 Cargo.toml default'
        required: false
        default: ''

permissions:
  contents: write # 上传 release asset 需要

jobs:
  release-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri 2 / webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev \
            build-essential curl wget file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-release
          workspaces: src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build with Tauri
        # 与 macOS 工作流一致：从仓库根目录调用 frontend 里的 CLI。
        # RUSTFLAGS 显式链接 libstdc++：rust-lld 默认不会自动链，否则报
        # `std::__cxx11::basic_string::_M_replace_cold` 等 undefined symbol。
        env:
          RUSTFLAGS: "-C link-arg=-lstdc++"
        run: |
          set -euo pipefail
          FEATURES="${{ github.event.inputs.features || '' }}"
          ARGS=(build --bundles deb appimage)
          if [ -n "$FEATURES" ]; then
            ARGS+=(--features "$FEATURES")
          fi
          ./frontend/node_modules/.bin/tauri "${ARGS[@]}"

      - name: Rename artifacts (统一命名)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/release/bundle"
          DEB=$(ls "$BUNDLE"/deb/*.deb | head -n1)
          IMG=$(ls "$BUNDLE"/appimage/*.AppImage | head -n1)
          test -n "$DEB" && test -n "$IMG" || { echo "::error::未找到 deb/appimage 产物"; exit 1; }
          cp "$DEB" "MJNexus-Reader-${TAG}-linux-x86_64.deb"
          cp "$IMG" "MJNexus-Reader-${TAG}-linux-x86_64.AppImage"
          echo "DEB=MJNexus-Reader-${TAG}-linux-x86_64.deb" >> "$GITHUB_ENV"
          echo "IMG=MJNexus-Reader-${TAG}-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJNexus-Reader-${{ github.ref_name }}-linux-deb
          path: ${{ env.DEB }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload .AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: MJNexus-Reader-${{ github.ref_name }}-linux-appimage
          path: ${{ env.IMG }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.AppImage
          draft: true
          generate_release_notes: false
          fail_on_unmatched_files: false
